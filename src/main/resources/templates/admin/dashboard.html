<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Dashboard')}"></head>
<body class="bg-gray-950 text-white min-h-screen p-4">

<script>
  function setScore(teamId, roundNum, questionNum, points) {
    fetch('/admin/score', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `teamId=${encodeURIComponent(teamId)}&roundNum=${roundNum}&questionNum=${questionNum}&points=${points}`
    });
    const cell = document.getElementById(`cell-${teamId}-${roundNum}-${questionNum}`);
    if (!cell) return;
    cell.querySelectorAll('[data-pts]').forEach(btn => {
      const match = Math.abs(parseFloat(btn.dataset.pts) - parseFloat(points)) < 0.001;
      btn.classList.toggle('ring-1', match);
      btn.classList.toggle('ring-white', match);
      btn.classList.toggle('bg-indigo-700', match);
    });
    const cb = cell.querySelector('input[type=checkbox]');
    if (cb) {
      const def = parseFloat(cell.dataset.defPts);
      cb.checked = Math.abs(parseFloat(points) - def) < 0.001;
    }
  }

  function onCheckbox(teamId, roundNum, questionNum, defPts, checked) {
    setScore(teamId, roundNum, questionNum, checked ? defPts : 0);
  }

  function toggleJoker(teamId, roundNum, btn) {
    const played = btn.classList.toggle('bg-yellow-500');
    btn.classList.toggle('bg-gray-700', !played);
    fetch('/admin/joker', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `teamId=${encodeURIComponent(teamId)}&roundNum=${roundNum}&played=${played}`
    });
  }

  function setFreeScore(teamId, roundNum, questionNum, input) {
    const pts = parseFloat(input.value);
    if (isNaN(pts)) return;
    fetch('/admin/score', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `teamId=${encodeURIComponent(teamId)}&roundNum=${roundNum}&questionNum=${questionNum}&points=${pts}`
    });
  }

  function showRound(n) {
    document.querySelectorAll('[data-panel]').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('[data-tab]').forEach(t => {
      t.classList.remove('bg-indigo-600');
      t.classList.add('bg-gray-800');
    });
    const panel = document.querySelector(`[data-panel="${n}"]`);
    const tab   = document.querySelector(`[data-tab="${n}"]`);
    if (panel) panel.classList.remove('hidden');
    if (tab)   { tab.classList.add('bg-indigo-600'); tab.classList.remove('bg-gray-800'); }
  }

  function markRoundComplete(roundNum, complete) {
    fetch('/admin/round/' + roundNum + '/complete', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'complete=' + complete
    });
  }

  function copyUrl() {
    const val = document.getElementById('public-url').value;
    navigator.clipboard.writeText(window.location.origin + val);
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  }

  // Restore active tab from URL hash on page load
  document.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.replace('#round-', '');
    showRound(hash && !isNaN(hash) ? parseInt(hash) : 1);
  });
</script>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<div class="flex flex-wrap items-center gap-3 mb-6 bg-gray-900 rounded-xl px-4 py-3">
  <h1 class="text-xl font-bold mr-2" th:text="${session.name()}">Quiz Night</h1>

  <div class="flex flex-1 items-center gap-2 min-w-0">
    <span class="text-gray-500 text-sm">Public URL:</span>
    <input id="public-url" readonly type="text"
           th:value="'/live/' + ${session.uuid()}"
           class="flex-1 min-w-0 bg-gray-800 border border-gray-700 rounded px-3 py-1 text-sm text-gray-300 cursor-pointer"
           onclick="this.select()"/>
    <button id="copy-btn" onclick="copyUrl()"
            class="shrink-0 bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Copy</button>
  </div>

  <form method="post" action="/admin/end" class="ml-auto"
        onsubmit="return confirm('End the quiz? Scores will be saved to history.')">
    <button class="bg-red-700 hover:bg-red-600 px-4 py-1.5 rounded-lg font-medium text-sm">
      End Quiz
    </button>
  </form>
</div>

<!-- ── Round tabs ──────────────────────────────────────────────────────────── -->
<div class="flex gap-2 mb-4 flex-wrap">
  <th:block th:each="r : ${#numbers.sequence(1, session.maxRounds())}">
    <button th:attr="data-tab=${r}"
            th:onclick="|showRound(${r})|"
            th:text="${r == 5} ? 'Round 5 ★' : (${r == 6 and r == session.maxRounds()} ? 'R6 Long' : 'Round ' + ${r})"
            class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition-colors">
    </button>
  </th:block>
</div>

<!-- ── Round panels ────────────────────────────────────────────────────────── -->
<th:block th:each="r : ${#numbers.sequence(1, session.maxRounds())}">
  <div th:attr="data-panel=${r}, id=${'round-' + r}" class="hidden">

    <!-- Round-complete toggle -->
    <div class="flex items-center justify-end mb-3">
      <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer select-none">
        <input type="checkbox"
               th:checked="${quizService.isRoundComplete(r)}"
               th:onchange="|markRoundComplete(${r}, this.checked)|"
               class="accent-green-500 w-4 h-4"/>
        Round complete (visible on scoreboard)
      </label>
    </div>

    <!-- Round 6 (Long Connects): set question count when none yet set -->
    <div th:if="${r == 6 and quizService.getQuestionsForRound(6) == 0}"
         class="mb-5 p-4 bg-gray-900 rounded-xl inline-flex items-center gap-3">
      <span class="text-gray-400 text-sm font-medium">Long Connects — how many answer fields?</span>
      <form method="post" th:action="'/admin/round/6/set-questions'" class="flex gap-2">
        <input type="number" name="count" min="1" max="30" placeholder="10" autofocus
               class="w-20 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-sm text-center focus:outline-none focus:border-indigo-500"/>
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded text-sm font-medium">
          Set
        </button>
      </form>
    </div>

    <!-- Scoring grid (shown when questions exist) -->
    <div th:if="${r != 6 or quizService.getQuestionsForRound(6) > 0}"
         class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-800 text-gray-400">
            <th class="text-left py-2 pr-6 font-medium">Team</th>
            <th:block th:if="${quizService.getQuestionsForRound(r) > 0}">
              <th th:each="q : ${#numbers.sequence(1, quizService.getQuestionsForRound(r))}"
                  th:text="${r == 6} ? ('A' + q) : ('Q' + q)"
                  class="px-2 py-2 font-medium text-center min-w-[110px]">
              </th>
            </th:block>
            <th class="px-3 py-2 font-medium text-center">Joker ★</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="team : ${teams}" class="border-b border-gray-900 hover:bg-gray-900/40">

            <td class="py-2 pr-6 font-medium whitespace-nowrap" th:text="${team.name()}"></td>

            <!-- Question cells -->
            <th:block th:if="${quizService.getQuestionsForRound(r) > 0}">
              <th:block th:each="q : ${#numbers.sequence(1, quizService.getQuestionsForRound(r))}">

                <!-- Rounds 1–4 (and any round > 6): checkbox + preset buttons -->
                <td th:if="${r != 5 and r != 6}"
                    th:id="${'cell-' + team.id() + '-' + r + '-' + q}"
                    th:attr="data-def-pts=${session.defaultPointsPerQuestion()}"
                    th:with="cs=${quizService.getScore(team.id(), r, q)}, dp=${session.defaultPointsPerQuestion()}"
                    class="px-2 py-1.5 text-center align-top">
                  <div class="flex flex-col items-center gap-1">
                    <input type="checkbox"
                           th:checked="${cs == dp}"
                           th:onchange="|onCheckbox('${team.id()}', ${r}, ${q}, ${dp}, this.checked)|"
                           class="accent-indigo-500 w-4 h-4 cursor-pointer"/>
                    <div class="flex gap-0.5 flex-wrap justify-center">
                      <button type="button" data-pts="0.25"
                              th:classappend="${cs == 0.25} ? ' ring-1 ring-white bg-indigo-700' : ''"
                              th:onclick="|setScore('${team.id()}', ${r}, ${q}, 0.25)|"
                              class="bg-gray-700 hover:bg-gray-600 text-xs px-1.5 py-0.5 rounded">¼</button>
                      <button type="button" data-pts="0.5"
                              th:classappend="${cs == 0.5} ? ' ring-1 ring-white bg-indigo-700' : ''"
                              th:onclick="|setScore('${team.id()}', ${r}, ${q}, 0.5)|"
                              class="bg-gray-700 hover:bg-gray-600 text-xs px-1.5 py-0.5 rounded">½</button>
                      <button type="button" data-pts="1"
                              th:classappend="${cs == 1.0} ? ' ring-1 ring-white bg-indigo-700' : ''"
                              th:onclick="|setScore('${team.id()}', ${r}, ${q}, 1)|"
                              class="bg-gray-700 hover:bg-gray-600 text-xs px-1.5 py-0.5 rounded">1</button>
                      <button type="button" data-pts="1.5"
                              th:classappend="${cs == 1.5} ? ' ring-1 ring-white bg-indigo-700' : ''"
                              th:onclick="|setScore('${team.id()}', ${r}, ${q}, 1.5)|"
                              class="bg-gray-700 hover:bg-gray-600 text-xs px-1.5 py-0.5 rounded">1½</button>
                      <button type="button" data-pts="2"
                              th:classappend="${cs == 2.0} ? ' ring-1 ring-white bg-indigo-700' : ''"
                              th:onclick="|setScore('${team.id()}', ${r}, ${q}, 2)|"
                              class="bg-gray-700 hover:bg-gray-600 text-xs px-1.5 py-0.5 rounded">2</button>
                    </div>
                  </div>
                </td>

                <!-- Round 5: -1 / 0 / +1 -->
                <td th:if="${r == 5}"
                    th:id="${'cell-' + team.id() + '-' + r + '-' + q}"
                    th:with="cs=${quizService.getScore(team.id(), r, q)}"
                    class="px-2 py-2 text-center align-middle">
                  <div class="flex gap-1 justify-center">
                    <button type="button" data-pts="-1"
                            th:classappend="${cs == -1.0} ? ' ring-1 ring-white' : ''"
                            th:onclick="|setScore('${team.id()}', ${r}, ${q}, -1)|"
                            class="bg-red-900 hover:bg-red-800 text-xs px-2.5 py-1.5 rounded font-mono font-bold">−1</button>
                    <button type="button" data-pts="0"
                            th:classappend="${cs == 0.0} ? ' ring-1 ring-white' : ''"
                            th:onclick="|setScore('${team.id()}', ${r}, ${q}, 0)|"
                            class="bg-gray-700 hover:bg-gray-600 text-xs px-2.5 py-1.5 rounded font-mono font-bold">0</button>
                    <button type="button" data-pts="1"
                            th:classappend="${cs == 1.0} ? ' ring-1 ring-white' : ''"
                            th:onclick="|setScore('${team.id()}', ${r}, ${q}, 1)|"
                            class="bg-green-900 hover:bg-green-800 text-xs px-2.5 py-1.5 rounded font-mono font-bold">+1</button>
                  </div>
                </td>

                <!-- Round 6 (Long Connects): free-form, accepts negatives -->
                <td th:if="${r == 6}"
                    th:id="${'cell-' + team.id() + '-' + r + '-' + q}"
                    class="px-2 py-1.5 text-center align-middle">
                  <input type="number" step="any" placeholder="—"
                         th:value="${quizService.getScore(team.id(), r, q) != 0.0 ? quizService.getScore(team.id(), r, q) : ''}"
                         th:onchange="|setFreeScore('${team.id()}', ${r}, ${q}, this)|"
                         class="w-16 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-center text-sm
                                focus:outline-none focus:border-indigo-500 [appearance:textfield]
                                [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"/>
                </td>

              </th:block>
            </th:block>

            <!-- Joker toggle -->
            <td class="px-3 py-1.5 text-center align-middle">
              <button type="button"
                      th:classappend="${quizService.isJokerPlayed(team.id(), r)} ? 'bg-yellow-500 text-black' : 'bg-gray-700'"
                      th:onclick="|toggleJoker('${team.id()}', ${r}, this)|"
                      class="px-3 py-1.5 rounded font-bold text-sm hover:opacity-80 transition-colors">★</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Add question (rounds 1–5; round 6 uses set-count above) -->
      <form th:unless="${r == 6}" method="post"
            th:action="'/admin/round/' + ${r} + '/add-question'"
            class="mt-3">
        <button type="submit"
                class="text-indigo-400 hover:text-indigo-300 text-sm font-medium">
          + Add question
        </button>
      </form>
    </div>

  </div>
</th:block>

</body>
</html>
