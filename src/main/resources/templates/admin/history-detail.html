<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('History')}"></head>
<body style="padding:16px;">
<div class="max-w-2xl mx-auto">

  <div class="flex items-center justify-between mb-6">
    <div>
      <div class="mono text-xs tracking-widest text-muted uppercase mb-1">Completed</div>
      <h1 class="text-2xl font-bold" th:text="${snapshot.sessionName()}">Cluesday N</h1>
      <p class="mono text-xs text-muted mt-1"
         th:text="${#temporals.format(snapshot.completedAt(), 'dd MMM yyyy, HH:mm')}"></p>
    </div>
    <a href="/quizSetup/history" class="btn-ghost" style="padding:6px 12px;font-size:12px;">&#8592; History</a>
  </div>

  <div class="card" style="overflow:hidden;">
    <div th:with="leaderboard=${snapshot.leaderboard()},
                  maxRound=${#lists.isEmpty(leaderboard) ? 0 : leaderboard.get(0).roundTotals().size()}">
      <table class="score-table">
        <thead>
          <tr>
            <th class="left" style="width:32px;">#</th>
            <th class="left" style="width:48px;">T#</th>
            <th th:each="r : ${#numbers.sequence(1, maxRound)}"
                th:text="'R' + ${r}"
                style="text-align:center;border-left:1px solid var(--border);"></th>
            <th style="text-align:right;border-left:1px solid var(--border);">Total</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="result, iter : ${leaderboard}"
              th:style="${iter.index == 0} ? 'background:#1a1300;' : ''">
            <td class="mono text-xs left text-muted" th:text="${iter.index + 1}"></td>
            <td class="mono font-medium left"
                th:style="${iter.index == 0} ? 'color:var(--amber);' : 'color:#7a9fff;'"
                th:text="${result.displayName()}">T1</td>
            <td th:each="r : ${#numbers.sequence(1, maxRound)}"
                th:with="pts=${result.roundTotals().get(r)}, joker=${result.jokerRounds().contains(r)}"
                style="text-align:center;border-left:1px solid var(--border);">
              <th:block th:if="${pts != null and pts != 0.0}">
                <span th:text="#numbers.formatDecimal(pts, 1, 1)"
                      th:style="${joker} ? 'color:var(--amber);font-weight:600;font-family:DM Mono,monospace;' : 'font-family:DM Mono,monospace;'"></span>
                <span th:if="${joker}" style="color:var(--amber);font-family:'DM Mono',monospace;">&#9733;</span>
              </th:block>
              <span th:unless="${pts != null and pts != 0.0}"
                    style="color:var(--border);font-family:'DM Mono',monospace;">&#8212;</span>
            </td>
            <td class="mono font-bold" style="text-align:right;border-left:1px solid var(--border);font-size:15px;"
                th:style="${iter.index == 0} ? 'color:var(--amber);' : ''"
                th:text="#numbers.formatDecimal(result.grandTotal(), 1, 1)"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
