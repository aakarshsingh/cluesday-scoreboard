<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('History')}"></head>
<body class="bg-gray-950 text-white min-h-screen p-4">

<div class="max-w-xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Quiz History</h1>
    <a href="/admin" class="text-gray-400 hover:text-white text-sm">&larr; Back</a>
  </div>

  <div th:if="${#lists.isEmpty(history)}"
       class="text-center py-16 text-gray-600">
    No quizzes completed yet.
  </div>

  <ul th:unless="${#lists.isEmpty(history)}" class="space-y-3">
    <li th:each="snap : ${history}">
      <a th:href="'/admin/history/' + ${snap.sessionUuid()}"
         class="flex items-center justify-between bg-gray-900 hover:bg-gray-800 rounded-xl px-5 py-4 transition-colors">
        <div>
          <p class="font-semibold" th:text="${snap.sessionName()}">Quiz Night</p>
          <p class="text-sm text-gray-500 mt-0.5"
             th:text="${#temporals.format(snap.completedAt(), 'dd MMM yyyy, HH:mm')}">
          </p>
        </div>
        <div class="text-right">
          <p class="text-sm text-gray-400"
             th:text="${#lists.size(snap.leaderboard())} + ' teams'">
          </p>
          <p class="text-xs text-gray-600 mt-0.5">
            Winner:
            <span th:if="${!#lists.isEmpty(snap.leaderboard())}"
                  th:text="${snap.leaderboard().get(0).teamName()}" class="text-gray-400">
            </span>
          </p>
        </div>
      </a>
    </li>
  </ul>
</div>

</body>
</html>
