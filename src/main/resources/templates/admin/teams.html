<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Tables')}"></head>
<body style="padding:16px;">

<div class="max-w-lg mx-auto">

  <div class="flex items-baseline justify-between mb-6">
    <div>
      <div class="mono text-xs tracking-widest text-muted uppercase mb-1">Setup</div>
      <h1 class="text-2xl font-bold" th:text="${quizSession.name()}">Cluesday</h1>
    </div>
    <span class="mono text-xs text-muted"
          th:text="${#temporals.format(quizSession.quizDate(), 'dd MMM yyyy')}"></span>
  </div>

  <!-- Table selector -->
  <section class="card p-5 mb-4">
    <h2 class="text-xs font-medium uppercase tracking-widest text-muted mb-4">Playing Tables</h2>
    <form method="post" action="/quizSetup/teams/set-tables">
      <div class="grid-5 mb-4">
        <th:block th:each="n : ${#numbers.sequence(1, 25)}">
          <label th:for="'t' + ${n}" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;">
            <input type="checkbox" name="tables" th:value="${n}" th:id="'t' + ${n}"
                   th:checked="${activeTables.contains(n)}"
                   style="position:absolute;opacity:0;width:0;height:0;"/>
            <span class="table-btn" th:text="${n}">1</span>
          </label>
        </th:block>
      </div>
      <button type="submit" class="btn-ghost w-full text-sm">Apply Selection</button>
    </form>
  </section>

  <!-- Add extra table -->
  <section class="card p-5 mb-4">
    <h2 class="text-xs font-medium uppercase tracking-widest text-muted mb-3">Add Extra Table</h2>
    <form hx-post="/quizSetup/teams/add"
          hx-target="#team-list"
          hx-swap="outerHTML"
          hx-on::after-request="this.reset()"
          class="flex gap-2">
      <input type="number" name="tableNumber" placeholder="Table #"
             class="field flex-1" style="max-width:140px;text-align:center;"/>
      <button type="submit" class="btn-primary" style="padding:9px 20px;font-size:13px;">Add</button>
    </form>
  </section>

  <!-- Team list -->
  <ul id="team-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:24px;">
    <li th:each="team : ${teams}"
        class="card" style="padding:10px 16px;display:flex;align-items:center;gap:12px;">
      <span class="mono font-medium text-amber" th:text="${team.displayName()}">T1</span>
    </li>
    <li th:if="${#lists.isEmpty(teams)}"
        class="text-sm text-muted text-center" style="padding:24px 0;">
      No tables selected
    </li>
  </ul>

  <a th:if="${!#lists.isEmpty(teams)}"
     href="/quizSetup/dashboard"
     class="btn-primary block w-full text-sm" style="padding:12px;font-size:14px;">
    Start Quiz &#8594;
  </a>

</div>

</body>
</html>
