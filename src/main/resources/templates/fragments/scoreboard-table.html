<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Styles live in public/scoreboard.html (.sb-*) so SSE swaps keep them -->
<table id="scoreboard" class="sb-table" th:fragment="table">
  <thead>
    <tr>
      <th class="sb-rank" onclick="sortSB(0)">#</th>
      <th class="sb-team" onclick="sortSB(1)">Team <span class="sb-arrow">&#8597;</span></th>
      <th th:each="r, ri : ${#numbers.sequence(1, quizSession.maxRounds())}"
          th:if="${completedRounds.contains(r)}"
          class="sb-round"
          th:attr="onclick='sortSB(' + ${ri.index + 2} + ')'"
          th:text="'R' + ${r}">R1</th>
      <th class="sb-total" th:attr="onclick='sortSB(' + (${#sets.size(completedRounds)} + 2) + ')'">
        Total <span class="sb-arrow">&#8597;</span></th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="result, iter : ${leaderboard}" data-row="1"
        th:classappend="${iter.index == 0} ? 'sb-leader'">
      <td class="sb-rank" th:text="${iter.index + 1}">1</td>
      <td class="sb-team" th:text="${result.displayName()}" th:title="${result.displayName()}">T1</td>
      <td th:each="r : ${#numbers.sequence(1, quizSession.maxRounds())}"
          th:if="${completedRounds.contains(r)}"
          class="sb-round"
          th:with="txt=${result.roundText(r)}">
        <span th:if="${!txt.isEmpty()}" th:text="${txt}">0</span>
        <span th:if="${txt.isEmpty()}" class="sb-empty">&#8212;</span>
      </td>
      <td class="sb-total" th:text="${result.totalText()}">0</td>
    </tr>

    <tr th:if="${#lists.isEmpty(leaderboard)}">
      <td colspan="99" class="sb-none">Scores appear here once rounds are marked complete</td>
    </tr>
  </tbody>
</table>
</body>
</html>
