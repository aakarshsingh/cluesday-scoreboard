<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' — Cluesday'">Cluesday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0b0d14;
      --surface: #111520;
      --surf2:   #181c2a;
      --border:  #1e2438;
      --text:    #dde1f0;
      --muted:   #4e5472;
      --amber:   #f0a500;
      --green:   #34d07a;
      --red:     #f05252;
      --blue:    #4d7cfe;
    }
    html, body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .mono { font-family: 'DM Mono', monospace; }

    /* ── Layout utils ──────────────────────────────── */
    .p-3  { padding: 12px; }
    .p-4  { padding: 16px; }
    .p-5  { padding: 20px; }
    .p-6  { padding: 24px; }
    .px-4 { padding-left: 16px; padding-right: 16px; }
    .py-2 { padding-top: 8px;  padding-bottom: 8px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-5 { margin-bottom: 20px; }
    .mb-6 { margin-bottom: 24px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mr-2 { margin-right: 8px; }
    .ml-auto { margin-left: auto; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .flex { display: flex; }
    .flex-1 { flex: 1; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-baseline { align-items: baseline; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .justify-end { justify-content: flex-end; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .w-full { width: 100%; }
    .max-w-sm  { max-width: 384px; }
    .max-w-lg  { max-width: 512px; }
    .max-w-xl  { max-width: 640px; }
    .max-w-2xl { max-width: 768px; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .hidden { display: none !important; }
    .overflow-x-auto { overflow-x: auto; }
    .min-w-0 { min-width: 0; }
    .block { display: block; }
    .relative { position: relative; }

    /* ── Typography ────────────────────────────────── */
    .text-xs   { font-size: 11px; }
    .text-sm   { font-size: 13px; }
    .text-base { font-size: 15px; }
    .text-lg   { font-size: 18px; }
    .text-xl   { font-size: 20px; }
    .text-2xl  { font-size: 24px; }
    .text-3xl  { font-size: 30px; }
    .font-medium  { font-weight: 500; }
    .font-semibold{ font-weight: 600; }
    .font-bold    { font-weight: 700; }
    .tracking-wide  { letter-spacing: .06em; }
    .tracking-wider { letter-spacing: .10em; }
    .tracking-widest{ letter-spacing: .15em; }
    .uppercase  { text-transform: uppercase; }
    .leading-tight { line-height: 1.25; }
    .whitespace-nowrap { white-space: nowrap; }
    .select-none { user-select: none; }

    /* ── Colour helpers ─────────────────────────────── */
    .text-muted  { color: var(--muted); }
    .text-amber  { color: var(--amber); }
    .text-red    { color: var(--red); }
    .text-blue   { color: var(--blue); }

    /* ── Card / surface ─────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    /* ── Form inputs ────────────────────────────────── */
    .field {
      display: block; width: 100%;
      background: var(--surf2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      transition: border-color 80ms;
    }
    .field:focus { outline: none; border-color: var(--blue); }
    select.field option { background: var(--surf2); }
    .field-sm {
      background: var(--surf2); border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 8px; color: var(--text); font-size: 12px;
      font-family: 'DM Mono', monospace;
    }
    .field-sm:focus { outline: none; border-color: var(--blue); }

    /* ── Buttons ────────────────────────────────────── */
    .btn-primary {
      background: var(--amber); color: #0b0d14;
      font-weight: 600; border-radius: 6px;
      padding: 10px 20px; border: none; cursor: pointer;
      font-size: 14px; font-family: 'Sora', sans-serif;
      transition: opacity 100ms; display: inline-block; text-decoration: none;
      text-align: center;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost {
      background: var(--surf2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 14px; cursor: pointer; font-size: 13px;
      font-family: 'Sora', sans-serif;
      transition: border-color 80ms; display: inline-block;
      text-decoration: none; text-align: center;
    }
    .btn-ghost:hover { border-color: #3a4060; }
    .btn-danger {
      background: #1a0808; color: var(--red);
      border: 1px solid #3d1212; border-radius: 6px;
      padding: 8px 14px; cursor: pointer; font-size: 13px;
      font-family: 'Sora', sans-serif; transition: border-color 80ms;
    }
    .btn-danger:hover { border-color: var(--red); }

    /* ── Score buttons ──────────────────────────────── */
    .sbtn {
      font-family: 'DM Mono', monospace;
      font-size: 11px; padding: 3px 7px; border-radius: 3px;
      background: var(--surf2); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
      transition: background 60ms, color 60ms, border-color 60ms;
      white-space: nowrap;
    }
    .sbtn:hover { border-color: #3a4060; color: var(--text); }
    .sbtn[data-active="true"] { background: #1e2a4a; border-color: var(--blue); color: #fff; }
    .sbtn-neg[data-active="true"] { background: #3d1212; border-color: var(--red); color: var(--red); }
    .sbtn-pos[data-active="true"] { background: #0f2d18; border-color: var(--green); color: var(--green); }

    /* ── Joker button ───────────────────────────────── */
    .joker-btn {
      font-size: 13px; width: 28px; height: 28px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surf2);
      color: var(--muted); cursor: pointer; transition: all 60ms;
    }
    .joker-btn[data-active="true"] { background: #3d2f00; border-color: var(--amber); color: var(--amber); }

    /* ── Free-score input ───────────────────────────── */
    .fscore {
      font-family: 'DM Mono', monospace; width: 56px;
      background: var(--surf2); border: 1px solid var(--border);
      border-radius: 3px; padding: 3px 6px;
      text-align: center; font-size: 12px; color: var(--text);
      appearance: textfield;
    }
    .fscore:focus { outline: none; border-color: var(--blue); }
    .fscore::-webkit-outer-spin-button, .fscore::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* ── Round tabs ─────────────────────────────────── */
    .rtab {
      font-family: 'DM Mono', monospace; font-size: 12px;
      padding: 7px 14px;
      border-bottom: 2px solid transparent;
      border-top: none; border-left: none; border-right: none;
      color: var(--muted); cursor: pointer; background: none;
      transition: color 60ms, border-color 60ms; white-space: nowrap;
    }
    .rtab:hover { color: var(--text); }
    .rtab.active { color: var(--amber); border-bottom-color: var(--amber); }

    /* ── Score table ────────────────────────────────── */
    .score-table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .score-table th {
      color: var(--muted); font-weight: 500; font-size: 11px;
      padding: 8px 6px; text-align: center;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .score-table th.left { text-align: left; }
    .score-table td { padding: 5px 6px; text-align: center; border-bottom: 1px solid #0f1118; vertical-align: middle; }
    .score-table td.left { text-align: left; }
    .score-table tbody tr:hover td { background: #0e1119; }

    /* ── Table selector buttons ─────────────────────── */
    .table-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 6px;
      font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace;
      border: 1px solid var(--border); background: var(--surf2); color: var(--muted);
      cursor: pointer; user-select: none; transition: all 60ms;
    }
    input[type=checkbox]:checked ~ .table-btn {
      border-color: var(--blue); background: #1e2a4a; color: #fff;
    }

    /* ── Checkbox ───────────────────────────────────── */
    .check-green { accent-color: var(--green); }

    /* ── Scrollbar ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Details/summary ────────────────────────────── */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
</html>
