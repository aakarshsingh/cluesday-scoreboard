<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${session != null} ? (${session.name()} + ' — Live') : 'Quiz Ended'">Live Scoreboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<!-- ── Quiz ended (no active session for this UUID) ────────────────────────── -->
<div th:if="${ended}" class="flex items-center justify-center min-h-screen">
  <div class="text-center">
    <p class="text-3xl font-bold mb-2">Quiz has ended</p>
    <p class="text-gray-500">Thanks for playing!</p>
  </div>
</div>

<!-- ── Live scoreboard ─────────────────────────────────────────────────────── -->
<div th:unless="${ended}" class="max-w-2xl mx-auto p-4">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6 pt-2">
    <h1 class="text-2xl font-bold" th:text="${session.name()}">Quiz Night</h1>
    <span class="flex items-center gap-1.5 text-sm text-green-400">
      <span id="status-dot" class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
      <span id="status-text">Live</span>
    </span>
  </div>

  <!-- Scoreboard container (swapped on SSE updates) -->
  <div id="scoreboard-container">
    <th:block th:replace="~{fragments/scoreboard-table :: table}"></th:block>
  </div>

</div>

<script th:unless="${ended}" th:inline="javascript">
  const uuid = /*[[${uuid}]]*/ '';

  const src = new EventSource('/live/' + uuid + '/events');

  src.addEventListener('score-update', (e) => {
    document.getElementById('scoreboard-container').innerHTML = e.data;
  });

  src.addEventListener('quiz-ended', (e) => {
    document.getElementById('scoreboard-container').innerHTML = e.data;
    src.close();
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (dot)  { dot.classList.remove('bg-green-400', 'animate-pulse'); dot.classList.add('bg-gray-600'); }
    if (text) { text.textContent = 'Ended'; text.classList.replace('text-green-400', 'text-gray-500'); }
  });

  src.onerror = () => {
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (dot)  { dot.classList.replace('bg-green-400', 'bg-yellow-400'); dot.classList.remove('animate-pulse'); }
    if (text) { text.textContent = 'Reconnecting…'; text.classList.replace('text-green-400', 'text-yellow-400'); }
  };

  src.onopen = () => {
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (dot)  { dot.classList.replace('bg-yellow-400', 'bg-green-400'); dot.classList.add('animate-pulse'); }
    if (text) { text.textContent = 'Live'; text.classList.replace('text-yellow-400', 'text-green-400'); }
  };
</script>

</body>
</html>
