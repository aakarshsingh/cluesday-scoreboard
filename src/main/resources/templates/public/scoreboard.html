<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Live')}"></head>
<body style="min-height:100vh;">

<!-- Quiz ended -->
<div th:if="${ended}"
     style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;">
  <div>
    <div class="text-2xl font-bold mb-2">Quiz has ended</div>
    <p class="text-sm text-muted">Thanks for playing!</p>
  </div>
</div>

<!-- Live scoreboard -->
<div th:unless="${ended}" style="max-width:680px;margin:0 auto;padding:24px 16px;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
    <div>
      <div class="mono text-xs text-muted uppercase tracking-widest" style="margin-bottom:4px;">Live</div>
      <h1 style="font-size:22px;font-weight:700;" th:text="${quizSession.name()}">Cluesday</h1>
    </div>
    <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);">
      <span id="status-dot"
            style="display:inline-block;width:8px;height:8px;border-radius:50%;
                   background:var(--green);animation:pulse 2s infinite;"></span>
      <span id="status-text" class="mono">LIVE</span>
    </span>
  </div>

  <div id="scoreboard-container" class="card" style="overflow:hidden;">
    <th:block th:replace="~{fragments/scoreboard-table :: table}"></th:block>
  </div>

  <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:12px;">
    Click any column header to sort
  </p>
</div>

<style>
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  #scoreboard th { transition: color 150ms; }
  #scoreboard th:hover { color: var(--text) !important; }
</style>

<script th:unless="${ended}" th:inline="javascript">
  const uuid = /*[[${uuid}]]*/ '';

  // ── Sort state ──────────────────────────────────────────────────────────────
  let sbSortCol = null;   // null = server order (by total desc)
  let sbSortAsc = false;

  function parseVal(txt) {
    if (!txt) return -99999;
    const clean = txt.replace('★', '').replace('—', '').trim();
    if (!clean) return -99999;
    if (clean.startsWith('T')) return parseInt(clean.slice(1)) || 0;
    return parseFloat(clean) || 0;
  }

  function applySortToTable() {
    if (sbSortCol === null) return;
    const tbody = document.querySelector('#scoreboard tbody');
    if (!tbody) return;
    const rows = Array.from(tbody.querySelectorAll('tr[data-row]'));
    if (rows.length < 2) return;
    rows.sort((a, b) => {
      const av = parseVal(a.querySelectorAll('td')[sbSortCol]?.textContent?.trim());
      const bv = parseVal(b.querySelectorAll('td')[sbSortCol]?.textContent?.trim());
      return sbSortAsc ? av - bv : bv - av;
    });
    rows.forEach(r => tbody.appendChild(r));
  }

  // Called by inline onclick in the fragment headers
  window.sortSB = function(col) {
    if (sbSortCol === col) {
      sbSortAsc = !sbSortAsc;
    } else {
      sbSortCol = col;
      sbSortAsc = (col === 1); // T# sorts ascending by default
    }
    applySortToTable();
  };

  // ── SSE ────────────────────────────────────────────────────────────────────
  const src = new EventSource('/live/' + uuid + '/events');

  src.addEventListener('score-update', e => {
    document.getElementById('scoreboard-container').innerHTML = e.data;
    applySortToTable(); // re-apply current sort after update
  });

  src.addEventListener('quiz-ended', e => {
    document.getElementById('scoreboard-container').innerHTML = e.data;
    src.close();
    setStatus('var(--muted)', 'ENDED', false);
  });

  src.onerror  = () => setStatus('var(--amber)', '...', false);
  src.onopen   = () => setStatus('var(--green)', 'LIVE', true);

  function setStatus(color, text, pulse) {
    const dot   = document.getElementById('status-dot');
    const label = document.getElementById('status-text');
    if (dot)   { dot.style.background = color; dot.style.animation = pulse ? 'pulse 2s infinite' : 'none'; }
    if (label) { label.textContent = text; label.parentElement.style.color = color; }
  }
</script>

</body>
</html>
